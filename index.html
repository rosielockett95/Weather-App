<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <title>Weather app</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <img src="assets/images/logo.svg" alt="Weather Now Logo" />
        </div>
        <select name="Units" id="unitSelect">
          <option value="">Units</option>
          <option value="metricBtn" selected>Metric</option>
          <option value="imperialBtn">Imperial</option>
        </select>
      </header>
      <h1>How's the sky looking today?</h1>
      <div class="search-container">
        <input placeholder="Search for a place..." id="search" type="text" />
        <button id="searchBtn">Search</button>
      </div>
      <div class="weather-app">
        <div class="hero-container">
          <section class="hero-card">
            <div>
              <div>
                <p class="currentDate"></p>
                <p class="location">Snodland, Kent</p>
              </div>
              <div>
                <p><span class="metric" id="currentTemp"></span></p>
              </div>
            </div>
          </section>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <p>Feels like</p>
            <p><span class="metric" id="feelsLikeTemp"></span></p>
          </div>
          <div class="stat-card">
            <p>Humidity</p>
            <p><span id="currentHumidity"></span></p>
          </div>
          <div class="stat-card">
            <p>Wind</p>
            <p><span class="metric" id="currentWindSpeed"></span></p>
          </div>
          <div class="stat-card">
            <p>Precipitation</p>
            <p><span class="metric" id="currentPrecipitation"></span></p>
          </div>
        </div>

        <section class="daily-forecast">
          <h2>Daily forecast</h2>
          <div class="days-grid">
            <div class="days">
              <p class="date"></p>
              <div>
                <p class="min metric"></p>
                <p class="max metric"></p>
              </div>
            </div>
            <div class="days">
              <p class="date"></p>
              <div>
                <p class="min metric"></p>
                <p class="max metric"></p>
              </div>
            </div>
            <div class="days">
              <p class="date"></p>
              <div>
                <p class="min metric"></p>
                <p class="max metric"></p>
              </div>
            </div>
            <div class="days">
              <p class="date"></p>
              <div>
                <p class="min metric"></p>
                <p class="max metric"></p>
              </div>
            </div>
            <div class="days">
              <p class="date"></p>
              <div>
                <p class="min metric"></p>
                <p class="max metric"></p>
              </div>
            </div>
            <div class="days">
              <p class="date"></p>
              <div>
                <p class="min metric"></p>
                <p class="max metric"></p>
              </div>
            </div>
            <div class="days">
              <p class="date"></p>
              <div>
                <p class="min metric"></p>
                <p class="max metric"></p>
              </div>
            </div>
          </div>
        </section>

        <aside class="hourly-sidebar">
          <div class="hourly-options-container">
            <h2>Hourly forecast</h2>
            <select name="hourlyDays" id="daysSelect">
              <option class="current-day"></option>
              <option class="current-day"></option>
              <option class="current-day"></option>
              <option class="current-day"></option>
              <option class="current-day"></option>
              <option class="current-day"></option>
              <option class="current-day"></option>
            </select>
          </div>

          <div class="hours">
            <p class="time"></p>
            <p class="hourly-temp metric"></p>
          </div>
          <div class="hours">
            <p class="time"></p>
            <p class="hourly-temp metric"></p>
          </div>
          <div class="hours">
            <p class="time"></p>
            <p class="hourly-temp metric"></p>
          </div>
          <div class="hours">
            <p class="time"></p>
            <p class="hourly-temp metric"></p>
          </div>
          <div class="hours">
            <p class="time"></p>
            <p class="hourly-temp metric"></p>
          </div>
          <div class="hours">
            <p class="time"></p>
            <p class="hourly-temp metric"></p>
          </div>
          <div class="hours">
            <p class="time"></p>
            <p class="hourly-temp metric"></p>
          </div>
          <div class="hours">
            <p class="time"></p>
            <p class="hourly-temp metric"></p>
          </div>
        </aside>
      </div>
    </main>
    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
